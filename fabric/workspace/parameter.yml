# fabric-cicd find/replace at publish time (fabric/deploy.py passes the environment name).
# The pipelines reference nb_orchestrator through sentinel GUIDs; each environment swaps
# them for the real item and workspace IDs, so no one re-links activities by hand.
find_replace:
  - find_value: "11111111-1111-1111-1111-111111111111"
    replace_value:
      dev: "$items.Notebook.nb_orchestrator.id"
      prod: "$items.Notebook.nb_orchestrator.id"
    item_type: "DataPipeline"
  - find_value: "22222222-2222-2222-2222-222222222222"
    replace_value:
      dev: "$workspace.id"
      prod: "$workspace.id"
    item_type: "DataPipeline"
